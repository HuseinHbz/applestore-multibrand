version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: applestore-db
    environment:
      POSTGRES_USER: apple
      POSTGRES_PASSWORD: store123
      POSTGRES_DB: applestore
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apple -d applestore"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Optional: pgAdmin for database management
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: applestore-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@applestore.ir
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
